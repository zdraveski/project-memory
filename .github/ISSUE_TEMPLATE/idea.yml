name: An idea
description: Something project-memory could do, or do better.
labels: [enhancement]
body:
  - type: textarea
    id: moment
    attributes:
      label: When would it help?
      description: The moment you wished it did this. A real example is the most useful thing you can give.
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: What would it do?
    validations:
      required: true
