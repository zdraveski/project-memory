name: mutate

# The full mutation check, split across 17 machines: GitHub Free runs 20 jobs
# at once for an account, and past that they queue. 20 machines took 6 min 44 s
# beside a push's test run, three of them queued; six took about 10 minutes,
# one 65. Started by hand (Actions > mutate > Run workflow, or `gh workflow
# run mutate.yml -f machines=N`); deploy.mjs --mutants-checked-on-github then
# skips its own run, on your word that this one passed for the commit.
on:
  workflow_dispatch:
    inputs:
      machines:
        description: Machines to split the mutants across (GitHub Free runs 20 jobs at once)
        default: '17'

jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      shards: ${{ steps.list.outputs.shards }}
    steps:
      - id: list
        env:
          MACHINES: ${{ inputs.machines }}
        # A block: `{ length: n }` in a plain value is YAML's `key: value`.
        run: |
          node -e "const n = Math.min(256, Math.max(1, Math.floor(Number(process.env.MACHINES)) || 20)); console.log('shards=' + JSON.stringify(Array.from({ length: n }, (_, i) => i + 1)))" >> "$GITHUB_OUTPUT"
  mutate:
    needs: plan
    strategy:
      fail-fast: false
      matrix:
        shard: ${{ fromJSON(needs.plan.outputs.shards) }}
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: node mutate.mjs --shard ${{ matrix.shard }}/${{ strategy.job-total }}
