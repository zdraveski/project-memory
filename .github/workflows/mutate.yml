name: mutate

# The full mutation check, split across six machines: about 15 minutes instead
# of 65 on one. Started by hand (Actions > mutate > Run workflow); deploy.mjs
# --mutants-checked-on-github then skips its own run, on your word that this
# one passed for the commit being deployed.
on: workflow_dispatch

jobs:
  mutate:
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4, 5, 6]
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: node mutate.mjs --shard ${{ matrix.shard }}/6
