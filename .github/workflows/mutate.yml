name: mutate

# The mutation check, split across 17 machines: GitHub Free runs 20 jobs at
# once for an account, and past that they queue. 20 machines took 6 min 44 s
# beside a push's test run, three of them queued; six took about 10 minutes,
# one 65. Runs every Monday with the automatic mutants too, or by hand (Actions >
# mutate > Run workflow, or `gh workflow run mutate.yml --ref <branch> -f machines=N`):
# every hand-written mutant, and with `-f auto=true` the automatic ones too.
on:
  # Every Monday, the whole check, automatic mutants too, on the 17 machines the plan step
  # defaults to; a merge meanwhile runs only the mutants on its changed lines (changed-lines.yml).
  schedule:
    - cron: '17 3 * * 1'
  workflow_dispatch:
    inputs:
      machines:
        description: Machines to split the mutants across (GitHub Free runs 20 jobs at once)
        default: '17'
      auto:
        description: Also run the automatic mutants (automut.mjs), not only the hand-written ones
        type: boolean
        default: false

# A run started by hand is never cut short.
concurrency:
  group: mutate-${{ github.ref }}

# Read the code, nothing more, whatever the repository's default.
permissions:
  contents: read

jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      shards: ${{ steps.list.outputs.shards }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - id: list
        env:
          MACHINES: ${{ inputs.machines }}
        run: node .github/plan-mutants.mjs >> "$GITHUB_OUTPUT"
  mutate:
    needs: plan
    strategy:
      fail-fast: false
      matrix:
        shard: ${{ fromJSON(needs.plan.outputs.shards) }}
    runs-on: windows-latest
    # 17 shards of the larger automatic set (1.5.3 kinds) can pass 60 min; 150 leaves room.
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      # Every value through env, none into the script's text.
      - shell: bash
        env:
          AUTO: ${{ (inputs.auto || github.event_name == 'schedule') && '1' || '' }}
          SHARD: ${{ matrix.shard }}/${{ strategy.job-total }}
        run: node tools/mutate.mjs --shard "$SHARD" ${AUTO:+--auto}
