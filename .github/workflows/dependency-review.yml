name: dependency-review

# Software composition analysis on every pull request. A dependency the
# change adds or updates (the plugin has none, so here the workflows'
# actions) with a known vulnerability or malware in GitHub's advisory
# database, of any severity, fails the check. An advisory that can't affect
# this project is let through only by its ID in allow-ghsas, with a comment
# saying why. The policy: SECURITY.md#dependencies. It needs the repository's
# dependency graph on (Settings > Advanced Security).
on:
  pull_request:

permissions:
  contents: read

jobs:
  dependency-review:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: low
