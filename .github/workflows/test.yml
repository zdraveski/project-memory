name: test

on:
  push:
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, node: 22 }
          - { os: ubuntu-latest, node: 24 }
          - { os: ubuntu-latest, node: 26 }
          - { os: windows-latest, node: 24 }
          - { os: windows-latest, node: 26 }
          - { os: macos-latest, node: 24 }
          - { os: macos-latest, node: 26 }
    runs-on: ${{ matrix.os }}
    # Windows holds a file another program opened here; the memory-tier test must prove it.
    env:
      REAL_LOCKS: "${{ matrix.os == 'windows-latest' && '1' || '' }}"
    # The six suites take ~3 minutes; a hang would otherwise hold a runner for 6 hours.
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
      # A fresh checkout has nothing changed: its parse (.mjs and .json), import and mutant-table checks, about a second.
      - run: node check.mjs
      - run: node store.test.mjs
      - run: node compact-gate.test.mjs
      - run: node handoff-log.test.mjs
      - run: node memory-tier.test.mjs
      - run: node memory.test.mjs
      - run: node journal.test.mjs
      # Each job its own random rounds: six minutes of fuzz a push, on three systems.
      - run: node fuzz.mjs 60

  # The workflow files themselves, before GitHub reads them: it once refused fuzz.yml over a %.
  actionlint:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      # A pinned release, checked against its published sha256; shellcheck on the runner checks the run: scripts too.
      - env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download v1.7.12 -R rhysd/actionlint -p actionlint_1.7.12_linux_amd64.tar.gz
          echo "8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8  actionlint_1.7.12_linux_amd64.tar.gz" | sha256sum -c -
          tar xzf actionlint_1.7.12_linux_amd64.tar.gz actionlint
          ./actionlint -color
