name: test

on:
  push:
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        node: [20, 24]
    runs-on: ${{ matrix.os }}
    # The six suites take ~3 minutes; a hang would otherwise hold a runner for 6 hours.
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      # A fresh checkout has nothing changed: its parse, import and mutant-table checks, about a second.
      - run: node check.mjs
      - run: node store.test.mjs
      - run: node compact-gate.test.mjs
      - run: node handoff-log.test.mjs
      - run: node memory-tier.test.mjs
      - run: node memory.test.mjs
      - run: node journal.test.mjs
      # Each job its own random rounds: six minutes of fuzz a push, on three systems.
      - run: node fuzz.mjs 60
