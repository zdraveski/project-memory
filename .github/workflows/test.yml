name: test

on:
  # A pull request's own run covers its branch; a push to a branch ran the same tests twice.
  push:
    branches: [master]
  pull_request:

# Read the code, nothing more, whatever the repository's default; actionlint's and zizmor's downloads are public releases.
permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        include:
          # Each system and each Node version once.
          - { os: ubuntu-latest, node: 22 }
          - { os: windows-latest, node: 24 }
          - { os: macos-latest, node: 26 }
    runs-on: ${{ matrix.os }}
    # Windows holds a file another program opened here; the memory-tier test must prove it.
    env:
      REAL_LOCKS: "${{ matrix.os == 'windows-latest' && '1' || '' }}"
    # The seven suites take ~3 minutes; a hang would otherwise hold a runner for 6 hours.
    timeout-minutes: 20
    steps:
      # A pull request's code runs here: the checkout keeps no token for it to read.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node }}
      # A fresh checkout has nothing changed: its parse (.mjs and .json) and import checks, a few seconds.
      - run: node check.mjs
      - run: node store.test.mjs
      - run: node compact-gate.test.mjs
      - run: node handoff-log.test.mjs
      - run: node memory-tier.test.mjs
      - run: node memory.test.mjs
      - run: node journal.test.mjs
      - run: node enforce.test.mjs
      - run: node enforce-hook.test.mjs
      # What a compaction keeps: the journal every fact, the print after it the start of each exchange it shows.
      - run: node survive.mjs

  # The workflow files themselves: GitHub once refused fuzz.yml over a %. After a merge, not on every pull request.
  actionlint:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # A pinned release, checked against its published sha256; shellcheck on the runner checks the run: scripts too.
      - env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download v1.7.12 -R rhysd/actionlint -p actionlint_1.7.12_linux_amd64.tar.gz
          echo "8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8  actionlint_1.7.12_linux_amd64.tar.gz" | sha256sum -c -
          tar xzf actionlint_1.7.12_linux_amd64.tar.gz actionlint
          ./actionlint -color

  # The workflows' security, which actionlint does not look at: template injection, risky triggers, leaked credentials.
  zizmor:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Pinned the same way; the token lets it check the actions used against GitHub's advisories.
      - env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download v1.32.0 -R zizmorcore/zizmor -p zizmor-x86_64-unknown-linux-gnu.tar.gz
          echo "bb110cc765eca9cd7efb2e284a956be5974c60027b0970f16397d86208a9957b  zizmor-x86_64-unknown-linux-gnu.tar.gz" | sha256sum -c -
          tar xzf zizmor-x86_64-unknown-linux-gnu.tar.gz zizmor
          ./zizmor --format=github .github/workflows
