name: scorecard

# OpenSSF Scorecard: how the repo follows security practices (pinned
# actions, token permissions, branch protection, a security policy...).
# It publishes the score for the README's badge and puts the findings under
# Security > Code scanning. Weekly, on the default branch:
# schedule is a trigger Scorecard supports. To publish, the workflow must have no
# top-level env or defaults, no write permission at the top, and only the
# approved actions in this job: no `run:` steps here.
on:
  schedule:
    - cron: '41 5 * * 6'

permissions:
  contents: read

jobs:
  analysis:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      # The findings, to code scanning.
      security-events: write
      # The OIDC token that proves the results came from this repo, for the badge.
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ossf/scorecard-action@fa7117db83c52d787ae5a89f350999701505d78e # v2.5.0
        with:
          results_file: results.sarif
          results_format: sarif
          publish_results: true
      - uses: github/codeql-action/upload-sarif@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          sarif_file: results.sarif
