name: changed-lines

# A merge's own lines: the mutants on what it changed (hand-written and automatic) and, after a change to a hook, 20 s of fuzz.
# After the merge, not on pull requests: it took up to an hour and failed 50 of 61 red PR runs (2026-11-27), and
# blocks nothing. A survivor here is fixed in the next patch. Its own workflow, not a job in test.yml: a green test
# run is then the gates alone, which deploy.mjs asks for, and a survivor still shows as a red run here. One system
# and Node; the whole mutation check and the long fuzz run on a schedule (mutate.yml, fuzz.yml).
on:
  push:
    branches: [master]

# A run on master is never cut short.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  changed-lines:
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      # The whole history, so the commit master was at before the push is there to diff against.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      # The commit master was at before this push, through env, never into the script's text.
      - shell: bash
        env:
          BASE: ${{ github.event.before }}
        run: node tools/check.mjs --full --base "$BASE"
