<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 560" width="1200" height="560" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">
  <title>How project-memory works</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#262B48"/>
      <stop offset="1" stop-color="#14172A"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="560" rx="28" fill="url(#bg)"/>
  <text x="60" y="96" font-size="40" font-weight="700" fill="#F4F1EA">How it works</text>
  <text x="60" y="138" font-size="24" fill="#9EA5C2">Every time Claude finishes a reply, in the background.</text>

  <!-- 1. You work with Claude -->
  <rect x="60" y="180" width="316" height="340" rx="20" fill="#1D2240" stroke="#323858" stroke-width="2"/>
  <g transform="translate(92 214)">
    <rect x="0" y="4" width="52" height="36" rx="10" fill="#F4F1EA"/>
    <path d="M10 38 L8 52 L22 40 Z" fill="#F4F1EA"/>
    <rect x="24" y="32" width="50" height="34" rx="10" fill="#1D2240" stroke="#F5B544" stroke-width="4"/>
    <path d="M60 64 L66 76 L52 66" fill="#1D2240" stroke="#F5B544" stroke-width="4" stroke-linejoin="round"/>
  </g>
  <text font-size="28" font-weight="700" fill="#F4F1EA"><tspan x="92" y="336">You work</tspan><tspan x="92" y="370">with Claude</tspan></text>
  <text font-size="21" fill="#C5CADF"><tspan x="92" y="418">It writes down your</tspan><tspan x="92" y="448">decisions, preferences</tspan><tspan x="92" y="478">and corrections.</tspan></text>

  <path d="M388 350 H430" stroke="#F5B544" stroke-width="6" stroke-linecap="round"/>
  <path d="M424 338 L440 350 L424 362 Z" fill="#F5B544"/>

  <!-- 2. project-memory saves -->
  <rect x="442" y="180" width="316" height="340" rx="20" fill="#1D2240" stroke="#F5B544" stroke-width="2"/>
  <g transform="translate(468 204)">
    <path d="M72 26 A34 34 0 1 1 24 26" fill="none" stroke="#F5B544" stroke-width="8" stroke-linecap="round"/>
    <path d="M31 19 L30 32 L18 20 Z" fill="#F5B544" stroke="#F5B544" stroke-width="3" stroke-linejoin="round"/>
    <rect x="34" y="34" width="28" height="33" rx="4" fill="#F4F1EA"/>
    <rect x="39" y="41" width="18" height="3.5" rx="1.75" fill="#F5B544"/>
    <rect x="39" y="48" width="15" height="3.5" rx="1.75" fill="#B9B2A3"/>
    <rect x="39" y="55" width="11" height="3.5" rx="1.75" fill="#B9B2A3"/>
  </g>
  <text font-size="28" font-weight="700" fill="#F4F1EA"><tspan x="474" y="336">project-memory</tspan><tspan x="474" y="370">saves</tspan></text>
  <g font-size="21" fill="#C5CADF">
    <circle cx="481" cy="411" r="5" fill="#F5B544"/><text x="496" y="418">tidies the notes</text>
    <circle cx="481" cy="441" r="5" fill="#F5B544"/><text x="496" y="448">records where you are</text>
    <circle cx="481" cy="471" r="5" fill="#F5B544"/><text x="496" y="478">keeps old versions</text>
  </g>

  <path d="M770 350 H812" stroke="#F5B544" stroke-width="6" stroke-linecap="round"/>
  <path d="M806 338 L822 350 L806 362 Z" fill="#F5B544"/>

  <!-- 3. The next conversation -->
  <rect x="824" y="180" width="316" height="340" rx="20" fill="#1D2240" stroke="#323858" stroke-width="2"/>
  <g transform="translate(852 210)">
    <rect x="4" y="14" width="72" height="54" rx="14" fill="#F4F1EA"/>
    <path d="M18 64 L14 86 L36 66 Z" fill="#F4F1EA"/>
    <rect x="16" y="30" width="40" height="7" rx="3.5" fill="#B9B2A3"/>
    <rect x="16" y="46" width="28" height="7" rx="3.5" fill="#B9B2A3"/>
    <path d="M66 2 H90 V46 L78 36 L66 46 Z" fill="#F5B544"/>
  </g>
  <text font-size="28" font-weight="700" fill="#F4F1EA"><tspan x="856" y="336">Your next</tspan><tspan x="856" y="370">conversation</tspan></text>
  <text font-size="21" fill="#C5CADF"><tspan x="856" y="418">starts already knowing</tspan><tspan x="856" y="448">where you stopped.</tspan></text>
</svg>
