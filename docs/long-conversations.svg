<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 550" width="1200" height="550" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">
  <title>How project-memory protects long conversations</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#262B48"/>
      <stop offset="1" stop-color="#14172A"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="550" rx="28" fill="url(#bg)"/>
  <text x="60" y="96" font-size="40" font-weight="700" fill="#F4F1EA">Long conversations, kept on track</text>
  <text x="60" y="138" font-size="24" fill="#9EA5C2">When a conversation gets too long, Claude Code shortens it to a summary.</text>

  <!-- 1. Before -->
  <rect x="60" y="180" width="316" height="330" rx="20" fill="#1D2240" stroke="#323858" stroke-width="2"/>
  <circle cx="108" cy="232" r="22" fill="#F5B544"/>
  <text x="108" y="241" font-size="24" font-weight="700" fill="#14172A" text-anchor="middle">1</text>
  <text x="144" y="242" font-size="28" font-weight="700" fill="#F4F1EA">Before</text>
  <rect x="90" y="280" width="256" height="28" rx="14" fill="#2E3456"/>
  <rect x="90" y="280" width="218" height="28" rx="14" fill="#F5B544"/>
  <text x="90" y="340" font-size="19" fill="#9EA5C2">85% full</text>
  <text font-size="21" fill="#C5CADF"><tspan x="90" y="392">Claude is asked to write</tspan><tspan x="90" y="422">its notes while there's</tspan><tspan x="90" y="452">still room.</tspan></text>

  <!-- 2. During -->
  <rect x="442" y="180" width="316" height="330" rx="20" fill="#1D2240" stroke="#323858" stroke-width="2"/>
  <circle cx="490" cy="232" r="22" fill="#F5B544"/>
  <text x="490" y="241" font-size="24" font-weight="700" fill="#14172A" text-anchor="middle">2</text>
  <text x="526" y="242" font-size="28" font-weight="700" fill="#F4F1EA">During</text>
  <rect x="472" y="280" width="256" height="28" rx="14" fill="#F5B544"/>
  <rect x="589" y="286" width="7" height="16" rx="2" fill="#14172A"/>
  <rect x="604" y="286" width="7" height="16" rx="2" fill="#14172A"/>
  <text x="472" y="340" font-size="19" fill="#9EA5C2">Full, in the middle of a task</text>
  <text font-size="21" fill="#C5CADF"><tspan x="472" y="392">project-memory asks</tspan><tspan x="472" y="422">Claude Code to wait for</tspan><tspan x="472" y="452">the end of the step</tspan><tspan x="472" y="482">Claude is on.</tspan></text>

  <!-- 3. After -->
  <rect x="824" y="180" width="316" height="330" rx="20" fill="#1D2240" stroke="#323858" stroke-width="2"/>
  <circle cx="872" cy="232" r="22" fill="#F5B544"/>
  <text x="872" y="241" font-size="24" font-weight="700" fill="#14172A" text-anchor="middle">3</text>
  <text x="908" y="242" font-size="28" font-weight="700" fill="#F4F1EA">After</text>
  <rect x="854" y="280" width="256" height="28" rx="14" fill="#2E3456"/>
  <rect x="854" y="280" width="64" height="28" rx="14" fill="#B9B2A3"/>
  <rect x="922" y="280" width="34" height="28" rx="14" fill="#F5B544"/>
  <text x="854" y="340" font-size="19" fill="#9EA5C2">Shortened to a summary</text>
  <text font-size="21" fill="#C5CADF"><tspan x="854" y="392">Claude is told what you</tspan><tspan x="854" y="422">asked, what it last said</tspan><tspan x="854" y="452">and what was still</tspan><tspan x="854" y="482">running.</tspan></text>
</svg>
