<!doctype html>
<meta charset="utf-8">
<title>Social card</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;700&display=block" rel="stylesheet">
<link href="style.css" rel="stylesheet">
<script src="icons.js"></script>
<style>
  /* 1280x640 for GitHub's social preview and the project page's og:image.
     Not an .art, so render.mjs skips it; docs-work/social-card.mjs shoots it to a PNG. */
  .card { box-sizing: border-box; position: relative; overflow: hidden; isolation: isolate; width: 1280px; height: 640px; padding: 64px 72px; color: var(--ink);
    font: 400 24px/1.4 var(--sans); display: grid; grid-template-columns: 200px 1fr; gap: 64px; align-items: center;
    background:
      radial-gradient(900px 520px at 4% -10%, rgba(37, 99, 235, .5), transparent 62%),
      radial-gradient(800px 480px at 108% 118%, rgba(124, 58, 237, .45), transparent 62%),
      radial-gradient(520px 260px at 62% 0%, rgba(34, 211, 238, .16), transparent 70%),
      linear-gradient(180deg, #081133 0%, #050a23 55%, #040719 100%); }
  .card::before { content: ""; position: absolute; inset: 0; z-index: -1;
    background-image: linear-gradient(rgba(120, 160, 255, .06) 1px, transparent 1px), linear-gradient(90deg, rgba(120, 160, 255, .06) 1px, transparent 1px);
    background-size: 48px 48px; -webkit-mask-image: linear-gradient(180deg, #000 0%, transparent 85%); }
  .card .stars { transform: scale(1.45); transform-origin: 0 0; }
  .logo { width: 200px; height: auto; filter: drop-shadow(0 0 40px rgba(34, 211, 238, .5)); }
  .card p { margin: 0; }
  .name { font: 800 92px/1 var(--sans); letter-spacing: -.035em; }
  .name span { background: linear-gradient(90deg, #22d3ee, #38bdf8); -webkit-background-clip: text; background-clip: text; color: transparent; }
  .card .tag { margin-top: 30px; font-size: 34px; font-weight: 500; color: #dbe7ff; line-height: 1.3; max-width: 820px; text-wrap: balance; }
  .card .under { margin-top: 14px; font-size: 26px; color: var(--body); max-width: 820px; text-wrap: balance; }
  .chips { margin-top: 36px; display: flex; flex-wrap: wrap; gap: 12px; }
  .chip { display: inline-flex; align-items: center; gap: .55em; padding: .45em .85em .45em .65em; border-radius: 99px; font-weight: 600; color: #dbe7ff;
    background: linear-gradient(180deg, rgba(80, 125, 255, .18), rgba(40, 60, 150, .1)); border: 1px solid var(--line); }
  .chip .pi { width: 1.25em; height: 1.25em; }
</style>

<div class="card">
  <i class="stars"></i>
  <img class="logo" src="brain.png" alt="">
  <div>
    <p class="name">project-<span>memory</span></p>
    <p class="tag">Ask Claude Code what you decided last month.</p>
    <p class="under">Claude Code forgets. project-memory remembers.<br>Saved only on your computer.</p>
    <div class="chips">
      <span class="chip"><svg class="pi"><use href="#p-magnifying-glass"/></svg>A journal you can ask</span>
      <span class="chip"><svg class="pi"><use href="#p-play-circle"/></svg>Picks up where you left off</span>
      <span class="chip"><svg class="pi"><use href="#p-key"/></svg>Secrets kept out</span>
      <span class="chip"><svg class="pi"><use href="#p-hard-drives"/></svg>Stays on your computer</span>
    </div>
  </div>
</div>
