<!doctype html>
<meta charset="utf-8">
<title>What you get</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;700&display=block" rel="stylesheet">
<link href="style.css" rel="stylesheet">
<style>
  .note { color: var(--muted); font-weight: 600; }
  .foot { margin-top: 26px; display: flex; gap: 12px; flex-wrap: wrap; }
</style>

<div class="art phone">
  <svg class="streaks" viewBox="0 0 600 760" preserveAspectRatio="xMidYMin slice" aria-hidden="true">
    <defs>
      <linearGradient id="sk" x1="0" x2="1"><stop offset="0" stop-color="#22d3ee" stop-opacity="0"/><stop offset=".55" stop-color="#38bdf8" stop-opacity=".6"/><stop offset="1" stop-color="#a78bfa" stop-opacity="0"/></linearGradient>
      <filter id="bl" x="-10%" y="-50%" width="120%" height="200%"><feGaussianBlur stdDeviation="3"/></filter>
    </defs>
    <path d="M300 -20 C 420 80, 520 50, 620 -10" stroke="url(#sk)" stroke-width="7" fill="none" filter="url(#bl)" opacity=".55"/>
    <path d="M300 -20 C 420 80, 520 50, 620 -10" stroke="url(#sk)" stroke-width="1.5" fill="none"/>
    <path d="M380 -20 C 480 110, 560 100, 620 40" stroke="url(#sk)" stroke-width="1" fill="none" opacity=".6"/>
  </svg>
  <i class="stars"></i>
  <i class="horizon"></i>
  <svg width="0" height="0" style="position:absolute"><linearGradient id="ig" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#22d3ee"/><stop offset="1" stop-color="#a78bfa"/></linearGradient></svg>

  <div class="eyebrow">What you get</div>
  <h1>What it <span class="grad">does for you.</span></h1>

  <div class="items">
    <div class="glass item">
      <div class="ico"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><path d="m10 8 6 4-6 4z"/></svg></div>
      <h2>Picks up where you left off</h2>
    </div>
    <div class="glass item">
      <div class="ico"><svg viewBox="0 0 24 24"><path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"/><path d="M3 3v5h5"/><path d="M12 7v5l4 2"/></svg></div>
      <h2>Keeps old versions of notes <span class="note">(needs Git)</span></h2>
    </div>
    <div class="glass item">
      <div class="ico"><svg viewBox="0 0 24 24"><path d="m3 17 2 2 4-4"/><path d="m3 7 2 2 4-4"/><path d="M13 6h8M13 12h8M13 18h8"/></svg></div>
      <h2>Keeps long tasks on track</h2>
    </div>
    <div class="glass item">
      <div class="ico"><svg viewBox="0 0 24 24"><circle cx="18" cy="5" r="3"/><circle cx="6" cy="12" r="3"/><circle cx="18" cy="19" r="3"/><path d="m8.6 13.5 6.8 4M15.4 6.5l-6.8 4"/></svg></div>
      <h2>Shares lessons across projects</h2>
    </div>
  </div>

  <div class="foot">
    <span class="chip">Free</span>
    <span class="chip">No account</span>
    <span class="chip">Never goes online</span>
  </div>
</div>
