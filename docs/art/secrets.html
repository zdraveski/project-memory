<!doctype html>
<meta charset="utf-8">
<title>Secrets</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;700&display=block" rel="stylesheet">
<link href="style.css" rel="stylesheet">
<script src="icons.js"></script>
<style>
  /* What happens to a key, a password or a cookie: three before and after lines, then two notes.
     The content is written once, in the template, and copied into both pictures. */
  .heads { display: grid; gap: .5em; margin-bottom: .6em; font-weight: 700; }
  .heads span { display: flex; align-items: center; gap: .5em; }
  .heads .b { color: var(--pink-ink); }
  .heads .a { color: var(--cyan-ink); }
  .dot { width: .6em; height: .6em; border-radius: 50%; background: currentColor; box-shadow: 0 0 8px currentColor; flex: none; }
  .rows { display: grid; gap: 12px; }
  .row { display: grid; align-items: center; padding: .7em .85em; gap: .6em; }
  .what { display: flex; align-items: center; gap: .55em; font-weight: 700; line-height: 1.2; }
  .code { font: 500 .9em/1.4 var(--mono); white-space: nowrap; padding: .45em .65em; border-radius: .5em; background: rgba(6, 11, 36, .75); border: 1px solid; }
  .code.bad { color: var(--pink-ink); border-color: rgba(244, 114, 182, .45); }
  .code.ok { color: var(--cyan-ink); border-color: rgba(34, 211, 238, .45); }
  .go { position: relative; background: linear-gradient(90deg, var(--pink), var(--cyan)); }
  .go::after { content: ""; position: absolute; border: 5px solid transparent; }
  .notes { display: grid; gap: 12px; margin-top: 12px; }
  .note { display: flex; align-items: center; gap: .75em; padding: .65em .85em; line-height: 1.35; }
  .note .tok { font-size: 1em; }

  .wide { padding: 24px 28px; }
  .wide .heads { grid-template-columns: 210px 1fr 24px 1fr; font-size: 15px; padding: 0 .85em; }
  .wide .heads .a { grid-column: 4; }
  .wide .heads .b { grid-column: 2; }
  .wide .row { grid-template-columns: 210px 1fr 24px 1fr; font-size: 17px; }
  .wide .code { font-size: 15px; }
  .wide .go { height: 2px; }
  .wide .go::after { right: -1px; top: -4px; border-left-color: var(--cyan); border-right: 0; }
  .wide .notes { grid-template-columns: 1fr 1fr; }
  .wide .note { font-size: 16px; }

  .narrow { padding: 22px; }
  .narrow .heads { gap: .3em; padding: 0 .3em; }
  .narrow .row { padding: .5em .6em .6em; gap: .35em; }
  .narrow .what { font-size: 1em; }
  .narrow .code { font-size: 1em; padding: .25em .4em; }
  .narrow .go { width: 2px; height: .8em; margin-left: 1.2em; background: linear-gradient(180deg, var(--pink), var(--cyan)); }
  .narrow .go::after { bottom: -1px; left: -4px; border-top-color: var(--cyan); border-bottom: 0; }
  .narrow .note { padding: .55em .65em; }
</style>

<template id="body">
  <div class="heads">
    <span class="b"><i class="dot"></i>What you typed or ran</span>
    <span class="a"><i class="dot"></i>What the journal keeps</span>
  </div>
  <div class="rows">
    <div class="glass row">
      <p class="what"><svg class="pi"><use href="#p-key"/></svg>A key in a command</p>
      <p class="code bad">export API_KEY=ghp_8fK…</p>
      <i class="go"></i>
      <p class="code ok">export API_KEY=[redacted]</p>
    </div>
    <div class="glass row">
      <p class="what"><svg class="pi"><use href="#p-lock-key"/></svg>A password typed in chat</p>
      <p class="code bad">the password is plum-42…</p>
      <i class="go"></i>
      <p class="code ok">the password is [redacted]</p>
    </div>
    <div class="glass row">
      <p class="what"><svg class="pi"><use href="#p-browsers"/></svg>A cookie</p>
      <p class="code bad">Cookie: sessionid=a1b2c3…</p>
      <i class="go"></i>
      <p class="code ok">Cookie: [redacted]</p>
    </div>
  </div>
  <div class="notes">
    <p class="glass lit note"><span class="ico"><svg class="pi"><use href="#p-folder-lock"/></svg></span><span>A note that holds a secret stays out of the snapshots, and startup names it.</span></p>
    <p class="glass hot note"><span class="ico warn"><svg class="pi warn"><use href="#p-eye-slash"/></svg></span><span>No tool catches every secret. Put the rest in <span class="tok">&lt;private&gt;</span>.</span></p>
  </div>
</template>

<div class="art wide"><i class="stars"></i></div>
<div class="art narrow"><i class="stars"></i></div>
<script>
  for (const a of document.querySelectorAll('.art')) a.append(document.getElementById('body').content.cloneNode(true));
</script>
