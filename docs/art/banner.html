<!doctype html>
<meta charset="utf-8">
<title>Banner</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;700&display=block" rel="stylesheet">
<link href="style.css" rel="stylesheet">
<script src="icons.js"></script>
<style>
  /* docs/banner.webp: the logo, the name, what it does, and three things it gives you on an orbit.
     The narrow one stacks the same for a phone. */
  .banner { background:
      radial-gradient(420px 260px at 50% 30%, rgba(34, 211, 238, .16), transparent 70%),
      radial-gradient(520px 300px at -10% -10%, rgba(37, 99, 235, .5), transparent 62%),
      radial-gradient(520px 320px at 110% 115%, rgba(124, 58, 237, .45), transparent 62%),
      linear-gradient(180deg, #060b26 0%, #040719 100%); }
  .streaks { position: absolute; inset: 0; width: 100%; height: 100%; z-index: -1; }
  .logo { height: auto; filter: drop-shadow(0 0 18px rgba(34, 211, 238, .45)); }
  .name { font-weight: 800; line-height: 1.05; letter-spacing: -.03em; }
  .name span { background: linear-gradient(90deg, #22d3ee, #38bdf8); -webkit-background-clip: text; background-clip: text; color: transparent; }
  .tag { font-weight: 500; color: #dbe7ff; line-height: 1.25; }
  .motto { display: flex; gap: .6em; align-items: center; color: #b9c6e4; font-weight: 500; }
  .motto i { width: 7px; height: 7px; border-radius: 50%; background: var(--cyan); box-shadow: 0 0 8px var(--cyan); }

  .wide.banner { height: 250px; padding: 0 30px; display: grid; grid-template-columns: 112px 1px 1fr 262px; gap: 24px; align-items: center; }
  .wide .logo { width: 112px; }
  .wide .rule { width: 1px; height: 128px; background: linear-gradient(180deg, transparent, rgba(160, 190, 255, .5), transparent); }
  .wide .name { font-size: 48px; }
  .wide .tag { margin-top: 10px; font-size: 23px; }
  .wide .motto { margin-top: 16px; font-size: 17px; }
  .wide .cards { position: relative; display: grid; gap: 10px; }
  .wide .orbit { position: absolute; left: -46px; right: -40px; top: 50%; height: 130px; transform: translateY(-50%) rotate(-10deg); z-index: -1; }
  .wide .card { display: flex; align-items: center; gap: .6em; padding: .45em .7em; font-size: 15px; font-weight: 600; color: #dbe7ff; border-radius: .7em; white-space: nowrap; }
  .wide .card .ico { width: 1.9em; height: 1.9em; border-radius: .55em; }
  .wide .card .ico .pi { width: 1.15em; height: 1.15em; }

  .narrow.banner { padding: 34px 26px 36px; text-align: center; display: grid; justify-items: center; }
  .narrow .logo { width: 104px; }
  .narrow .name { margin-top: 16px; font-size: 58px; }
  .narrow .tag { margin-top: 14px; font-size: 30px; }
  .narrow .motto { margin-top: 20px; }
</style>

<div class="art wide banner">
  <svg class="streaks" viewBox="0 0 880 250" preserveAspectRatio="none" aria-hidden="true">
    <path d="M330 -20 C 500 90, 700 60, 900 -10" stroke="url(#sk)" stroke-width="7" fill="none" filter="url(#bl)" opacity=".5"/>
    <path d="M330 -20 C 500 90, 700 60, 900 -10" stroke="url(#sk)" stroke-width="1.4" fill="none"/>
    <path d="M-40 236 C 200 200, 520 290, 900 226" stroke="url(#sk)" stroke-width="6" fill="none" filter="url(#bl)" opacity=".45"/>
    <path d="M-40 236 C 200 200, 520 290, 900 226" stroke="url(#sk)" stroke-width="1.1" fill="none"/>
  </svg>
  <i class="stars"></i>
  <img class="logo" src="brain.png" alt="">
  <span class="rule"></span>
  <div>
    <p class="name">project-<span>memory</span></p>
    <p class="tag">Stop re-explaining your project to Claude Code.</p>
    <p class="motto">Remember<i></i>Restore<i></i>Continue</p>
  </div>
  <div class="cards">
    <svg class="orbit" viewBox="0 0 300 130" preserveAspectRatio="none" aria-hidden="true">
      <defs><linearGradient id="ob" x1="0" x2="1"><stop offset="0" stop-color="#22d3ee"/><stop offset=".55" stop-color="#3b82f6"/><stop offset="1" stop-color="#8b5cf6"/></linearGradient></defs>
      <ellipse cx="150" cy="65" rx="146" ry="58" fill="none" stroke="url(#ob)" stroke-width="6" filter="url(#bl)" opacity=".7"/>
      <ellipse cx="150" cy="65" rx="146" ry="58" fill="none" stroke="url(#ob)" stroke-width="1.5"/>
    </svg>
    <p class="glass card"><span class="ico"><svg class="pi"><use href="#p-play-circle"/></svg></span>Picks up where you left off</p>
    <p class="glass card lit"><span class="ico"><svg class="pi"><use href="#p-magnifying-glass"/></svg></span>A journal you can ask</p>
    <p class="glass card"><span class="ico"><svg class="pi"><use href="#p-key"/></svg></span>Secrets kept out</p>
  </div>
</div>

<div class="art narrow banner">
  <svg class="streaks" viewBox="0 0 600 380" preserveAspectRatio="none" aria-hidden="true">
    <path d="M250 -20 C 400 80, 520 50, 640 -10" stroke="url(#sk)" stroke-width="7" fill="none" filter="url(#bl)" opacity=".55"/>
    <path d="M250 -20 C 400 80, 520 50, 640 -10" stroke="url(#sk)" stroke-width="1.5" fill="none"/>
    <path d="M-40 340 C 140 300, 380 420, 640 330" stroke="url(#sk)" stroke-width="7" fill="none" filter="url(#bl)" opacity=".5"/>
    <path d="M-40 340 C 140 300, 380 420, 640 330" stroke="url(#sk)" stroke-width="1.2" fill="none"/>
  </svg>
  <i class="stars"></i>
  <img class="logo" src="brain.png" alt="">
  <p class="name">project-<span>memory</span></p>
  <p class="tag">Stop re-explaining your project to Claude Code.</p>
  <p class="motto">Remember<i></i>Restore<i></i>Continue</p>
</div>
