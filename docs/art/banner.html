<!doctype html>
<meta charset="utf-8">
<title>Banner, for a phone</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;700&display=block" rel="stylesheet">
<link href="style.css" rel="stylesheet">
<script src="icons.js"></script>
<style>
  /* docs/banner.webp, stacked for a phone: the logo, the name, what it does. Only a narrow
     version: the wide one is banner.webp itself, made elsewhere. */
  .banner { padding: 34px 26px 36px; text-align: center; display: grid; justify-items: center;
    background:
      radial-gradient(420px 260px at 50% 30%, rgba(34, 211, 238, .16), transparent 70%),
      radial-gradient(520px 300px at -10% -10%, rgba(37, 99, 235, .5), transparent 62%),
      radial-gradient(520px 320px at 110% 115%, rgba(124, 58, 237, .45), transparent 62%),
      linear-gradient(180deg, #060b26 0%, #040719 100%); }
  .streaks { position: absolute; inset: 0; width: 100%; height: 100%; z-index: -1; }
  .logo { width: 104px; height: auto; filter: drop-shadow(0 0 18px rgba(34, 211, 238, .45)); }
  .banner .name { margin-top: 16px; font: 800 58px/1.05 var(--sans); letter-spacing: -.03em; }
  .name span { background: linear-gradient(90deg, #22d3ee, #38bdf8); -webkit-background-clip: text; background-clip: text; color: transparent; }
  .banner .tag { margin-top: 14px; font-size: 30px; font-weight: 500; color: #dbe7ff; }
  .banner .motto { margin-top: 20px; display: flex; gap: .6em; align-items: center; color: #b9c6e4; font-weight: 500; }
  .motto i { width: 8px; height: 8px; border-radius: 50%; background: var(--cyan); box-shadow: 0 0 8px var(--cyan); }
</style>

<div class="art narrow banner">
  <svg class="streaks" viewBox="0 0 600 380" preserveAspectRatio="none" aria-hidden="true">
    <path d="M250 -20 C 400 80, 520 50, 640 -10" stroke="url(#sk)" stroke-width="7" fill="none" filter="url(#bl)" opacity=".55"/>
    <path d="M250 -20 C 400 80, 520 50, 640 -10" stroke="url(#sk)" stroke-width="1.5" fill="none"/>
    <path d="M-40 340 C 140 300, 380 420, 640 330" stroke="url(#sk)" stroke-width="7" fill="none" filter="url(#bl)" opacity=".5"/>
    <path d="M-40 340 C 140 300, 380 420, 640 330" stroke="url(#sk)" stroke-width="1.2" fill="none"/>
  </svg>
  <i class="stars"></i>
  <img class="logo" src="brain.png" alt="">
  <p class="name">project-<span>memory</span></p>
  <p class="tag">Give Claude Code a memory.</p>
  <p class="motto">Remember<i></i>Restore<i></i>Continue</p>
</div>
