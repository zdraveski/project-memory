<!doctype html>
<meta charset="utf-8">
<title>The problem</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;700&display=block" rel="stylesheet">
<link href="style.css" rel="stylesheet">
<style>
  .scene { margin-top: 36px; display: grid; grid-template-columns: 1fr 150px 1fr; align-items: center; }
  .term { border-radius: 16px; overflow: hidden; align-self: stretch; }
  .term.past { opacity: .8; }
  .term.now { border-color: rgba(244, 114, 182, .55);
    box-shadow: 0 0 0 1px rgba(244, 114, 182, .2), 0 0 36px rgba(244, 114, 182, .18), 0 22px 44px -18px rgba(0,0,0,.7); }
  .bar { display: flex; align-items: center; gap: 8px; padding: 12px 16px;
    border-bottom: 1px solid var(--line); background: rgba(10, 18, 50, .55);
    font: 600 14px/1 Inter, sans-serif; color: var(--muted); }
  .bar i { width: 10px; height: 10px; border-radius: 50%; background: #2a3763; }
  .bar b { margin-left: 8px; color: #dbe7ff; font-weight: 700; }
  .bar span { margin-left: auto; font: 500 13px/1 var(--mono); }
  .log { padding: 18px 20px 22px; font: 500 15.5px/1.6 var(--mono); color: #d7e3ff; }
  .you { color: #fff; }
  .you::before { content: "> "; color: var(--cyan); font-weight: 700; }
  .cl { margin-top: 12px; padding-left: 20px; position: relative; color: var(--body); }
  .cl::before { content: "●"; position: absolute; left: 0; color: #9fb4e6; }
  .ask { color: #fff; background: linear-gradient(transparent 62%, rgba(244, 114, 182, .35) 62%); }
  .now .cl::before { color: var(--pink); text-shadow: 0 0 8px var(--pink); }
  .gap { display: grid; justify-items: center; gap: 12px; position: relative; }
  .gap::before { content: ""; position: absolute; top: 31px; left: -8px; right: -8px; height: 2px;
    background: repeating-linear-gradient(90deg, rgba(244,114,182,.7) 0 6px, transparent 6px 12px);
    -webkit-mask-image: linear-gradient(90deg, transparent, #000 30%, #000 70%, transparent); }
  .gap .ico { position: relative; width: 62px; height: 62px; border-radius: 50%;
    background: radial-gradient(circle, rgba(244,114,182,.28), rgba(30,20,70,.9) 70%);
    box-shadow: inset 0 0 0 1px rgba(244,114,182,.6), 0 0 30px rgba(244,114,182,.35); }
  .gap .ico svg { stroke: #f9a8d4; filter: drop-shadow(0 0 6px rgba(244,114,182,.9)); }
  .gap p { margin: 0; text-align: center; font: 700 12.5px/1.3 Inter, sans-serif; letter-spacing: .12em;
    text-transform: uppercase; color: #f9a8d4; }
</style>

<div class="art">
  <svg class="streaks" viewBox="0 0 1000 520" preserveAspectRatio="xMidYMin slice" aria-hidden="true">
    <defs>
      <linearGradient id="sk" x1="0" x2="1"><stop offset="0" stop-color="#22d3ee" stop-opacity="0"/><stop offset=".55" stop-color="#38bdf8" stop-opacity=".6"/><stop offset="1" stop-color="#a78bfa" stop-opacity="0"/></linearGradient>
      <filter id="bl" x="-10%" y="-50%" width="120%" height="200%"><feGaussianBlur stdDeviation="3"/></filter>
    </defs>
    <path d="M560 -20 C 720 70, 860 40, 1020 -10" stroke="url(#sk)" stroke-width="7" fill="none" filter="url(#bl)" opacity=".55"/>
    <path d="M560 -20 C 720 70, 860 40, 1020 -10" stroke="url(#sk)" stroke-width="1.5" fill="none"/>
    <path d="M640 -20 C 780 100, 900 90, 1020 30" stroke="url(#sk)" stroke-width="1" fill="none" opacity=".6"/>
  </svg>
  <i class="stars"></i>
  <i class="horizon warm"></i>
  <svg width="0" height="0" style="position:absolute"><linearGradient id="ig" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#22d3ee"/><stop offset="1" stop-color="#a78bfa"/></linearGradient></svg>

  <div class="eyebrow warn">The problem</div>
  <h1>Every new conversation <span class="grad warn">starts fresh.</span></h1>
  <p class="sub">Close Claude Code today, and tomorrow you explain again where you were.</p>

  <div class="scene">
    <div class="glass term past">
      <div class="bar"><i></i><i></i><i></i><b>Monday</b><span>18:40</span></div>
      <div class="log">
        <div class="you">Let's stop here for today.</div>
        <div class="cl">The launch email is half written. Pricing comes next.</div>
      </div>
    </div>

    <div class="gap">
      <div class="ico"><svg viewBox="0 0 24 24"><path d="m18.84 12.25 1.72-1.71h-.02a5 5 0 0 0-.12-7.07 5 5 0 0 0-6.95 0l-1.72 1.71"/><path d="m5.17 11.75-1.71 1.71a5 5 0 0 0 .12 7.07 5 5 0 0 0 6.95 0l1.71-1.71"/><path d="M8 2v3M2 8h3M16 19v3M19 16h3"/></svg></div>
      <p>New<br>conversation</p>
    </div>

    <div class="glass term now">
      <div class="bar"><i></i><i></i><i></i><b>Tuesday</b><span>09:15</span></div>
      <div class="log">
        <div class="you">Let's carry on.</div>
        <div class="cl">Sure. <span class="ask">What were we working on?</span></div>
      </div>
    </div>
  </div>
</div>
