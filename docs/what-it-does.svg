<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 780" width="1200" height="780" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">
  <title>What project-memory does for you</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#262B48"/>
      <stop offset="1" stop-color="#14172A"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="780" rx="28" fill="url(#bg)"/>
  <text x="60" y="96" font-size="40" font-weight="700" fill="#F4F1EA">What project-memory does for you</text>
  <text x="60" y="138" font-size="24" fill="#9EA5C2">It works on its own after every reply, and it never goes online.</text>

  <!-- Picks up where you left off -->
  <rect x="60" y="180" width="520" height="270" rx="20" fill="#1D2240" stroke="#323858" stroke-width="2"/>
  <g transform="translate(100 228)">
    <rect x="4" y="14" width="72" height="54" rx="14" fill="#F4F1EA"/>
    <path d="M18 64 L14 86 L36 66 Z" fill="#F4F1EA"/>
    <rect x="16" y="30" width="40" height="7" rx="3.5" fill="#B9B2A3"/>
    <rect x="16" y="46" width="28" height="7" rx="3.5" fill="#B9B2A3"/>
    <path d="M66 2 H90 V46 L78 36 L66 46 Z" fill="#F5B544"/>
  </g>
  <text font-size="30" font-weight="700" fill="#F4F1EA"><tspan x="232" y="262">Picks up where</tspan><tspan x="232" y="298">you left off</tspan></text>
  <text font-size="23" fill="#C5CADF"><tspan x="232" y="346">A new conversation starts</tspan><tspan x="232" y="378">knowing where the last</tspan><tspan x="232" y="410">one stopped.</tspan></text>

  <!-- Keeps old versions of your notes -->
  <rect x="620" y="180" width="520" height="270" rx="20" fill="#1D2240" stroke="#323858" stroke-width="2"/>
  <g transform="translate(660 228)">
    <path d="M72 26 A34 34 0 1 1 24 26" fill="none" stroke="#F5B544" stroke-width="8" stroke-linecap="round"/>
    <path d="M31 19 L30 32 L18 20 Z" fill="#F5B544" stroke="#F5B544" stroke-width="3" stroke-linejoin="round"/>
    <rect x="34" y="34" width="28" height="33" rx="4" fill="#F4F1EA"/>
    <rect x="39" y="41" width="18" height="3.5" rx="1.75" fill="#F5B544"/>
    <rect x="39" y="48" width="15" height="3.5" rx="1.75" fill="#B9B2A3"/>
    <rect x="39" y="55" width="11" height="3.5" rx="1.75" fill="#B9B2A3"/>
  </g>
  <text font-size="30" font-weight="700" fill="#F4F1EA"><tspan x="792" y="262">Keeps old versions</tspan><tspan x="792" y="298">of your notes</tspan></text>
  <text font-size="23" fill="#C5CADF"><tspan x="792" y="346">Ask Claude, and an</tspan><tspan x="792" y="378">earlier version comes</tspan><tspan x="792" y="410">back (needs Git).</tspan></text>

  <!-- Keeps long tasks on track -->
  <rect x="60" y="480" width="520" height="270" rx="20" fill="#1D2240" stroke="#323858" stroke-width="2"/>
  <g transform="translate(100 528)">
    <rect x="58" y="6" width="30" height="36" rx="5" fill="#F4F1EA"/>
    <rect x="63" y="14" width="18" height="4" rx="2" fill="#F5B544"/>
    <rect x="63" y="22" width="14" height="4" rx="2" fill="#B9B2A3"/>
    <rect x="63" y="30" width="10" height="4" rx="2" fill="#B9B2A3"/>
    <path d="M68 46 H78 L73 54 Z" fill="#F5B544"/>
    <rect x="4" y="60" width="88" height="18" rx="9" fill="#2E3456"/>
    <rect x="4" y="60" width="75" height="18" rx="9" fill="#F5B544"/>
  </g>
  <text font-size="30" font-weight="700" fill="#F4F1EA"><tspan x="232" y="562">Keeps long tasks</tspan><tspan x="232" y="598">on track</tspan></text>
  <text font-size="23" fill="#C5CADF"><tspan x="232" y="646">Notes are saved before</tspan><tspan x="232" y="678">a long conversation</tspan><tspan x="232" y="710">is shortened.</tspan></text>

  <!-- Shares what you teach it -->
  <rect x="620" y="480" width="520" height="270" rx="20" fill="#1D2240" stroke="#323858" stroke-width="2"/>
  <g transform="translate(660 528)">
    <path d="M48 38 L15 62 M48 38 L48 62 M48 38 L81 62" stroke="#9EA5C2" stroke-width="3" stroke-linecap="round"/>
    <rect x="34" y="2" width="28" height="34" rx="5" fill="#F4F1EA"/>
    <rect x="39" y="10" width="18" height="4" rx="2" fill="#F5B544"/>
    <rect x="39" y="18" width="14" height="4" rx="2" fill="#B9B2A3"/>
    <rect x="39" y="26" width="10" height="4" rx="2" fill="#B9B2A3"/>
    <rect x="3" y="62" width="10" height="7" rx="2" fill="#F5B544"/>
    <rect x="3" y="66" width="24" height="20" rx="4" fill="none" stroke="#F5B544" stroke-width="4"/>
    <rect x="37" y="62" width="10" height="7" rx="2" fill="#F5B544"/>
    <rect x="37" y="66" width="24" height="20" rx="4" fill="none" stroke="#F5B544" stroke-width="4"/>
    <rect x="71" y="62" width="10" height="7" rx="2" fill="#F5B544"/>
    <rect x="71" y="66" width="24" height="20" rx="4" fill="none" stroke="#F5B544" stroke-width="4"/>
  </g>
  <text font-size="30" font-weight="700" fill="#F4F1EA"><tspan x="792" y="562">Shares what</tspan><tspan x="792" y="598">you teach it</tspan></text>
  <text font-size="23" fill="#C5CADF"><tspan x="792" y="646">Lessons that apply</tspan><tspan x="792" y="678">everywhere reach every</tspan><tspan x="792" y="710">project.</tspan></text>
</svg>
